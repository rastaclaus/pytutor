# Настройки Ruff: https://docs.astral.sh/ruff/settings/
# Версия Python берётся из `requires-python` в pyproject.toml (сейчас 3.14).

line-length = 120

# stubs/ — копии файлов упражнений (шаблоны для сброса), их не линтуем.
extend-exclude = ["stubs"]

[lint]
select = ["ALL"]
ignore = [
  "COM812",  # конфликтует с ruff format (magic trailing comma)
  "ISC001",  # конфликтует с ruff format (однострочные импорты)
  "D203",  # пустая строка перед docstring класса — конфликтует с ruff format
  "D211",  # обратное к D203
  "D213",  # summary docstring со второй строки (D212 требует обратное)
  "RUF002",  # неоднозначные unicode-символы в docstring (кириллица)
  "RUF003",  # то же в комментариях (кириллица)
  "CPY001",  # требование copyright-заголовка
  "ANN401",  # запрет typing.Any
  # В наборах про functools/typing старый стиль TypeVar/Generic показан
  # намеренно: именно он и является темой упражнений.
  "UP047",
  # Проект русскоязычный: кириллица в строках и литералах — не опечатка.
  "RUF001",
  # Упражнения учат collections.namedtuple, а не typing.NamedTuple.
  "PYI024",
]

[lint.per-file-ignores]
"tests/**" = [
  "D",
  "S",
  "ANN201",
  "PLR2004",
  "SLF",
  "INP001",
  # Тесты нарочно бросают «плохие» исключения и проверяют их тип без match.
  "EM101",
  "EM102",
  "TRY003",
  "PT011",
  # Кириллица в сообщениях об ошибках — не опечатка.
  "RUF001",
  # bool передаётся позиционно намеренно: проверяем диспетчеризацию bool -> int.
  "FBT003",
]
# В заготовках упражнений импорты оставлены как подсказки: до решения они
# намеренно не используются, поэтому F401 здесь шумит (а TC003 — потому что
# подсказки видны только в аннотациях). TODO в заготовках — это подсказки
# студенту, а не технический долг.
"src/pytutor/exercises/**" = ["F401", "TC003", "TD002", "TD003", "FIX002"]
# PLW1641: класс с __eq__ и без __hash__ в Python и так нехешируем — это
# ожидаемое поведение в упражнении про total_ordering.
"src/pytutor/exercises/functools/ex10_total_ordering.py" = ["PLW1641"]
"solutions/**" = [
  "D",
  "INP001",
  # В эталонах нарочно показан «простой» стиль: короткие сообщения об ошибках
  # и вызовы zip/batched/map без strict, потому что рядом есть упражнения
  # именно про strict-режимы. `assert` нужен для сужения типа перед `raise`.
  "EM101",
  "TRY003",
  "B905",
  "B911",
  "B912",
  "S101",
  "PLR2004",
  "PLW1641",
]
"scripts/**" = ["D", "INP001", "T201", "RUF001"]
# CLI тренажёра по определению печатает в stdout, кириллица — не опечатка.
"src/pytutor/__init__.py" = ["T201", "RUF001"]

[lint.isort]
known-first-party = ["pytutor"]

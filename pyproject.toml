[project]
name = "pytutor"
version = "0.1.0"
description = "Тренажёр по модулям стандартной библиотеки Python с автопроверкой через pytest"
readme = "README.md"
authors = [{ name = "Artem Shestopalov", email = "tema.rastaclaus2016@yandex.ru" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pytutor = "pytutor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib-режим обязателен: тестовые файлы разных наборов называются одинаково
# (tests/exercises/<модуль>/test_exNN_*.py), иначе pytest ругается на дубли имён.
addopts = "-q --import-mode=importlib"

[project]
name = "pytutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem Shestopalov", email = "tema.rastaclaus2016@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pytutor = "pytutor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
